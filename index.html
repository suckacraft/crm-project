<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportunities Kanban</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f2f5;
      --col-bg: #ebecf0;
      --card-bg: #fff;
      --card-shadow: 0 1px 3px rgba(0,0,0,.12);
      --accent: #0052cc;
      --accent-light: #e6f0ff;
      --danger: #de350b;
      --success: #00875a;
      --warn: #ff8b00;
      --text: #172b4d;
      --muted: #6b778c;
      --border: #dfe1e6;
      --radius: 6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Nudge banner ── */
    #nudge-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: #fffae6;
      border-bottom: 1px solid #ffe380;
      font-size: 13px;
      flex-shrink: 0;
    }
    #nudge-banner.show { display: flex; }
    #nudge-banner strong { color: #974f0c; }
    #nudge-banner .nudge-cta {
      background: var(--warn);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    #nudge-banner .nudge-dismiss {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
    }

    /* ── Diff banner ── */
    #diff-banner {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 10px 20px;
      background: #e3fcef;
      border-bottom: 1px solid #abf5d1;
      font-size: 13px;
      flex-shrink: 0;
    }
    #diff-banner.show { display: flex; }
    #diff-banner .diff-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #diff-banner .tag {
      font-size: 11px; font-weight: 600;
      padding: 2px 7px; border-radius: 10px;
    }
    .tag-new     { background: #e3fcef; color: #006644; border: 1px solid #abf5d1; }
    .tag-removed { background: #ffebe6; color: #bf2600; border: 1px solid #ffbdad; }
    #diff-banner .diff-dismiss {
      margin-left: auto; align-self: flex-start;
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 18px; line-height: 1;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      height: 52px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #topbar h1 { font-size: 15px; font-weight: 700; flex: 1; }

    #search {
      font-size: 13px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 180px;
      outline: none;
    }
    #search:focus { border-color: var(--accent); }

    #last-upload { font-size: 12px; color: var(--muted); white-space: nowrap; }

    /* Upload button */
    #btn-upload-wrap { position: relative; }
    #btn-upload {
      font-size: 13px; font-weight: 600;
      padding: 6px 14px;
      border-radius: var(--radius);
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background .15s;
    }
    #btn-upload:hover { background: #0043a8; }
    #csv-input { display: none; }

    /* Group-by toggle */
    #groupby-wrap { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .gb-btn {
      font-size: 12px; font-weight: 500;
      padding: 5px 10px;
      border: none; background: #fff; color: var(--muted); cursor: pointer;
    }
    .gb-btn.active { background: var(--accent); color: #fff; }

    /* ── Board ── */
    #board {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      overflow-x: auto;
      flex: 1;
      align-items: flex-start;
    }

    /* ── Column ── */
    .column {
      flex-shrink: 0;
      width: 272px;
      display: flex;
      flex-direction: column;
      background: var(--col-bg);
      border-radius: var(--radius);
      max-height: calc(100vh - 120px);
    }
    .column-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 12px;
      background: #fff;
      border-radius: var(--radius) var(--radius) 0 0;
      font-weight: 600;
      font-size: 13px;
      border-left: 3px solid var(--accent);
    }
    .column-header .col-total { font-size: 11px; color: var(--muted); font-weight: 400; }
    .column-header .count {
      margin-left: auto;
      font-size: 11px; font-weight: 600;
      background: var(--border); color: var(--muted);
      border-radius: 10px; padding: 1px 7px;
    }
    .column-body {
      padding: 8px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .column-body.drag-over { background: #d0e4ff; border-radius: 0 0 var(--radius) var(--radius); }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 9px 11px;
      box-shadow: var(--card-shadow);
      cursor: grab;
      transition: box-shadow .15s, opacity .15s;
      user-select: none;
      border-left: 3px solid transparent;
      position: relative;
    }
    .card:active { cursor: grabbing; }
    .card.dragging { opacity: .35; }
    .card.saving { opacity: .55; pointer-events: none; }
    .card.card-new { border-left-color: var(--success) !important; }
    .card.card-removed {
      border-left-color: var(--danger) !important;
      opacity: .6;
      text-decoration: line-through;
    }

    .card-badge {
      position: absolute;
      top: 6px; right: 8px;
      font-size: 9px; font-weight: 700;
      padding: 1px 5px; border-radius: 8px;
      text-transform: uppercase;
    }
    .badge-new     { background: #e3fcef; color: var(--success); }
    .badge-removed { background: #ffebe6; color: var(--danger); }

    .card-title {
      font-size: 13px; font-weight: 600;
      line-height: 1.3; margin-bottom: 5px;
      padding-right: 44px;
    }
    .card-account {
      font-size: 11px; color: var(--muted);
      margin-bottom: 7px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .card-value { font-size: 12px; font-weight: 600; }

    /* Stage chip (shown when grouping by status) */
    .stage-chip {
      font-size: 10px; font-weight: 600;
      padding: 2px 6px; border-radius: 10px;
      background: var(--accent-light); color: var(--accent);
      white-space: nowrap;
    }

    /* Inline status select */
    .status-select {
      font-size: 11px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 4px;
      background: #f4f5f7;
      color: var(--text);
      cursor: pointer;
      outline: none;
      max-width: 120px;
    }
    .status-select:focus { border-color: var(--accent); background: #fff; }

    /* Weight input */
    .weight-wrap { margin-left: auto; display: flex; align-items: center; gap: 3px; }
    .weight-label { font-size: 10px; color: var(--muted); }
    .weight-input {
      width: 44px; font-size: 12px; font-weight: 600;
      text-align: center;
      border: 1px solid var(--border); border-radius: 4px;
      padding: 2px 3px;
      background: #f4f5f7; color: var(--text);
      outline: none; cursor: text;
    }
    .weight-input:focus { border-color: var(--accent); background: #fff; }
    .weight-pct { font-size: 11px; color: var(--muted); }

    /* Rating dot */
    .rating-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .r-hot  { background: var(--danger); }
    .r-warm { background: var(--warn); }
    .r-cold { background: #8993a4; }

    /* ── Empty state ── */
    #empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex: 1;
      color: var(--muted);
    }
    #empty-state.show { display: flex; }
    #empty-state svg { opacity: .25; }
    #empty-state h2 { font-size: 18px; font-weight: 600; color: var(--text); }
    #empty-state p { font-size: 13px; max-width: 340px; text-align: center; }
    #empty-state button {
      font-size: 14px; font-weight: 600;
      padding: 9px 22px;
      border-radius: var(--radius); border: none;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    #empty-state button:hover { background: #0043a8; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 18px; right: 18px;
      background: #253858; color: #fff;
      font-size: 13px; padding: 9px 15px;
      border-radius: var(--radius);
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      opacity: 0; transform: translateY(6px);
      transition: opacity .2s, transform .2s;
      pointer-events: none; z-index: 999; max-width: 300px;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.error { background: var(--danger); }
    #toast.success { background: var(--success); }

    .empty-col { font-size: 12px; color: var(--muted); text-align: center; padding: 16px 0; }
  </style>
</head>
<body>

<!-- Twice-weekly nudge banner -->
<div id="nudge-banner">
  <span>⏰ <strong>Time to refresh your pipeline.</strong> Upload a new CSV export from Dynamics to keep the board up to date.</span>
  <button class="nudge-cta" id="nudge-cta-btn">Upload CSV</button>
  <button class="nudge-dismiss" id="nudge-dismiss" title="Dismiss">×</button>
</div>

<!-- Diff banner (shown after upload with changes) -->
<div id="diff-banner">
  <div class="diff-row">
    <strong>CSV imported</strong>
    <span id="diff-new-tags"></span>
    <span id="diff-removed-tags"></span>
    <button class="diff-dismiss" id="diff-dismiss">×</button>
  </div>
  <div id="diff-detail" style="font-size:12px;color:var(--muted)"></div>
</div>

<!-- Top bar -->
<div id="topbar">
  <h1>Opportunities Kanban</h1>
  <input id="search" type="search" placeholder="Search…" />
  <div id="groupby-wrap">
    <button class="gb-btn active" data-gb="stage">By Stage</button>
    <button class="gb-btn" data-gb="status">By Status</button>
  </div>
  <span id="last-upload"></span>
  <div id="btn-upload-wrap">
    <button id="btn-upload">⬆ Upload CSV</button>
    <input id="csv-input" type="file" accept=".csv,.xlsx,.xls,text/csv" />
  </div>
</div>

<!-- Board (hidden when empty) -->
<div id="board"></div>

<!-- Empty state -->
<div id="empty-state">
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
  </svg>
  <h2>No opportunities yet</h2>
  <p>Export your opportunities from Dynamics 365 as a CSV and upload it here to populate the board.</p>
  <button id="empty-upload-btn">Upload CSV</button>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  // ── Storage keys ──────────────────────────────────────────────────────────
  const KEY_DATA       = "kanban_opportunities";   // array of opp objects
  const KEY_UPLOAD_TS  = "kanban_last_upload";     // ISO timestamp
  const KEY_STATUSES   = "kanban_statuses";        // { id: stage }  manual overrides
  const KEY_WEIGHTS    = "kanban_weights";         // { id: number } manual overrides
  const KEY_NUDGE_DIS  = "kanban_nudge_dismissed"; // ISO date dismissed

  // ── State ─────────────────────────────────────────────────────────────────
  let opportunities = [];   // current canonical list
  let manualStatuses = {};  // id → stage (drag overrides)
  let manualWeights  = {};  // id → number (weight overrides)
  let groupBy = "stage";    // "stage" | "status"
  let dragSourceCard = null;
  let diffState = null;     // { added: [], removed: [] }

  // ── Boot ──────────────────────────────────────────────────────────────────
  function boot() {
    opportunities   = load(KEY_DATA) || [];
    manualStatuses  = load(KEY_STATUSES) || {};
    manualWeights   = load(KEY_WEIGHTS) || {};

    const savedGb = localStorage.getItem("kanban_groupby");
    if (savedGb) { groupBy = savedGb; syncGbButtons(); }

    refreshLastUploadLabel();
    checkNudge();
    renderBoard();

    // Wire events
    document.getElementById("btn-upload").addEventListener("click", () => csvInput().click());
    document.getElementById("empty-upload-btn").addEventListener("click", () => csvInput().click());
    document.getElementById("nudge-cta-btn").addEventListener("click", () => { csvInput().click(); });
    document.getElementById("nudge-dismiss").addEventListener("click", dismissNudge);
    document.getElementById("diff-dismiss").addEventListener("click", () => {
      document.getElementById("diff-banner").classList.remove("show");
    });

    csvInput().addEventListener("change", onFileSelected);

    document.querySelectorAll(".gb-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        groupBy = btn.dataset.gb;
        localStorage.setItem("kanban_groupby", groupBy);
        syncGbButtons();
        renderBoard();
      });
    });

    let searchTimer;
    document.getElementById("search").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderBoard, 180);
    });
  }

  function csvInput() { return document.getElementById("csv-input"); }

  // ── localStorage helpers ──────────────────────────────────────────────────
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
  function load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }

  // ── Nudge: twice-weekly check ─────────────────────────────────────────────
  function checkNudge() {
    const lastUpload = localStorage.getItem(KEY_UPLOAD_TS);
    if (!lastUpload) {
      // No data yet — nudge shown via empty state, not banner
      return;
    }

    const dismissedDate = localStorage.getItem(KEY_NUDGE_DIS);
    const today = todayStr();
    if (dismissedDate === today) return; // already dismissed today

    const lastUploadDate = new Date(lastUpload);
    const now = new Date();
    const daysSince = (now - lastUploadDate) / 86400000;

    // Show banner if it's been 3+ days since last upload
    if (daysSince >= 3) {
      document.getElementById("nudge-banner").classList.add("show");
    }
  }

  function dismissNudge() {
    localStorage.setItem(KEY_NUDGE_DIS, todayStr());
    document.getElementById("nudge-banner").classList.remove("show");
  }

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  // ── CSV parsing ───────────────────────────────────────────────────────────
  function onFileSelected(e) {
    const file = e.target.files[0];
    if (!file) return;
    const isExcel = /\.(xlsx|xls)$/i.test(file.name);
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = isExcel ? parseXLSX(ev.target.result) : parseCSV(ev.target.result);
        if (parsed.length === 0) { showToast("File contained no rows", true); return; }
        importData(parsed);
      } catch (err) {
        showToast("Could not parse file: " + err.message, true);
      }
      e.target.value = "";
    };
    if (isExcel) reader.readAsArrayBuffer(file);
    else reader.readAsText(file);
  }

  function parseXLSX(arrayBuffer) {
    const wb = XLSX.read(arrayBuffer, { type: "array", cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
    // Normalise: SheetJS gives us { HeaderName: value } objects
    return rows.map(row => {
      const lower = {};
      Object.keys(row).forEach(k => { lower[k.trim().toLowerCase()] = String(row[k] ?? "").trim(); });
      return normaliseRow(lower);
    }).filter(r => r && r.name);
  }

  function parseCSV(text) {
    const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
    if (lines.length < 2) return [];

    const headers = splitCSVRow(lines[0]).map(h => h.trim().toLowerCase());

    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const vals = splitCSVRow(lines[i]);
      const row = {};
      headers.forEach((h, j) => { row[h] = (vals[j] || "").trim(); });
      rows.push(row);
    }
    return rows.map(normaliseRow).filter(r => r.name);
  }

  function splitCSVRow(line) {
    const cols = [];
    let cur = "", inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === "," && !inQ) {
        cols.push(cur); cur = "";
      } else {
        cur += c;
      }
    }
    cols.push(cur);
    return cols;
  }

  // Map flexible Dynamics export column names → our internal schema
  function normaliseRow(row) {
    const g = (...candidates) => {
      for (const c of candidates) {
        if (row[c] !== undefined && row[c] !== "") return row[c];
      }
      return "";
    };

    const name = g("opportunity name", "name", "topic", "subject", "title", "opportunity");
    if (!name) return null;

    // Stable ID: prefer an explicit ID field, otherwise hash the name
    const id = g("opportunityid", "id", "opportunity id", "crm id") || slugify(name);

    const stage = g(
      "sales stage", "stage", "stepname", "step name", "pipeline stage",
      "bpf stage", "process stage"
    ) || "Unknown";

    const status = g("status reason", "statuscode", "status", "state") || "Open";
    const account = g("account name", "account", "company", "customer", "organisation", "organization");
    const owner = g("owner", "owning user", "assigned to", "salesperson", "sales rep");
    const estValue = parseMoney(g("est. revenue", "estimated revenue", "estimated value", "revenue", "value", "deal size", "amount"));
    const probability = parseFloat(g("probability", "close probability", "closeprobability", "weight", "likelihood")) || 0;
    const closeDate = g("est. close date", "close date", "estimated close date", "closedate", "target close date");
    const rating = g("rating", "lead rating", "opportunityratingcode");

    return { id, name, stage, status, account, owner, estValue, probability, closeDate, rating };
  }

  function parseMoney(s) {
    if (!s) return 0;
    return parseFloat(s.replace(/[^0-9.\-]/g, "")) || 0;
  }

  function slugify(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  // ── Import & diff ─────────────────────────────────────────────────────────
  function importData(newRows) {
    const oldMap = new Map(opportunities.map(o => [o.id, o]));
    const newMap = new Map(newRows.map(o => [o.id, o]));

    const added   = newRows.filter(o => !oldMap.has(o.id));
    const removed = opportunities.filter(o => !newMap.has(o.id));

    // Merge: keep manual status/weight overrides for existing opps
    opportunities = newRows.map(o => {
      const old = oldMap.get(o.id);
      return {
        ...o,
        // carry forward manual edits if stage/probability unchanged in new CSV
        _isNew: !old,
      };
    });

    // Clear stale overrides for removed opps
    removed.forEach(o => { delete manualStatuses[o.id]; delete manualWeights[o.id]; });

    save(KEY_DATA, opportunities.map(o => ({ ...o, _isNew: false })));
    save(KEY_STATUSES, manualStatuses);
    save(KEY_WEIGHTS, manualWeights);

    const ts = new Date().toISOString();
    localStorage.setItem(KEY_UPLOAD_TS, ts);
    refreshLastUploadLabel();
    dismissNudge(); // fresh data — reset nudge

    diffState = { added, removed };
    showDiffBanner(added, removed);
    renderBoard();
    showToast(`Imported ${newRows.length} opportunit${newRows.length === 1 ? "y" : "ies"}`, false, "success");
  }

  function showDiffBanner(added, removed) {
    const banner = document.getElementById("diff-banner");
    if (added.length === 0 && removed.length === 0) {
      banner.classList.remove("show");
      return;
    }

    const newTags = document.getElementById("diff-new-tags");
    const rmTags  = document.getElementById("diff-removed-tags");
    const detail  = document.getElementById("diff-detail");

    newTags.innerHTML = added.length
      ? `<span class="tag tag-new">+${added.length} new</span>` : "";
    rmTags.innerHTML = removed.length
      ? `<span class="tag tag-removed">−${removed.length} removed</span>` : "";

    const parts = [];
    if (added.length)   parts.push("Added: " + added.map(o => o.name).join(", "));
    if (removed.length) parts.push("Removed: " + removed.map(o => o.name).join(", "));
    detail.textContent = parts.join("  ·  ");

    banner.classList.add("show");
  }

  // ── Rendering ─────────────────────────────────────────────────────────────
  const STAGE_COLORS = {
    Qualify: "#0052cc", Develop: "#6554c0", Propose: "#ff8b00",
    Close: "#00875a", Won: "#00875a", Lost: "#de350b",
    Unknown: "#8993a4",
  };
  function stageColor(s) {
    return STAGE_COLORS[s] || "#8993a4";
  }

  const STATUS_ORDER = ["Open", "In Progress", "On Hold", "Won", "Canceled", "Out-Sold", "Lost"];
  const STAGE_ORDER  = ["Qualify", "Develop", "Propose", "Close", "Won", "Lost"];

  function effectiveStage(o) {
    return manualStatuses[o.id] || o.stage || "Unknown";
  }
  function effectiveWeight(o) {
    return manualWeights[o.id] != null ? manualWeights[o.id] : (o.probability || 0);
  }

  function filtered() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    if (!q) return opportunities;
    return opportunities.filter(o =>
      o.name.toLowerCase().includes(q) ||
      (o.account || "").toLowerCase().includes(q) ||
      (o.owner || "").toLowerCase().includes(q)
    );
  }

  function renderBoard() {
    const board = document.getElementById("board");
    const emptyState = document.getElementById("empty-state");
    board.innerHTML = "";

    if (opportunities.length === 0) {
      board.style.display = "none";
      emptyState.classList.add("show");
      return;
    }
    board.style.display = "flex";
    emptyState.classList.remove("show");

    const opps = filtered();
    const groupFn = groupBy === "stage"
      ? o => effectiveStage(o)
      : o => o.status || "Open";

    const orderRef = groupBy === "stage" ? STAGE_ORDER : STATUS_ORDER;
    const groups = {};
    opps.forEach(o => {
      const k = groupFn(o);
      if (!groups[k]) groups[k] = [];
      groups[k].push(o);
    });

    // All opps (for deleted-from-CSV markers still in removed state)
    if (diffState) {
      diffState.removed.forEach(o => {
        const k = groupFn(o);
        if (!groups[k]) groups[k] = [];
        if (!groups[k].find(x => x.id === o.id)) {
          groups[k].push({ ...o, _removed: true });
        }
      });
    }

    const keys = [
      ...orderRef.filter(k => groups[k]),
      ...Object.keys(groups).filter(k => !orderRef.includes(k)),
    ];

    keys.forEach(key => board.appendChild(buildColumn(key, groups[key] || [])));
  }

  function buildColumn(key, opps) {
    const col = document.createElement("div");
    col.className = "column";
    col.dataset.key = key;

    const total = opps.filter(o => !o._removed).reduce((s, o) => s + (o.estValue || 0), 0);
    const totalStr = total > 0 ? fmt(total) : "";
    const color = stageColor(key);

    col.innerHTML = `
      <div class="column-header" style="border-left-color:${color}">
        <span>${escHtml(key)}</span>
        ${totalStr ? `<span class="col-total">${totalStr}</span>` : ""}
        <span class="count">${opps.filter(o => !o._removed).length}</span>
      </div>
      <div class="column-body" data-key="${key}">
        ${opps.length === 0 ? '<p class="empty-col">Drop cards here</p>' : ""}
      </div>`;

    const body = col.querySelector(".column-body");
    body.addEventListener("dragover", e => { e.preventDefault(); body.classList.add("drag-over"); });
    body.addEventListener("dragleave", e => { if (!body.contains(e.relatedTarget)) body.classList.remove("drag-over"); });
    body.addEventListener("drop", e => {
      e.preventDefault();
      body.classList.remove("drag-over");
      if (dragSourceCard && dragSourceCard.dataset.key !== key) {
        dropCard(dragSourceCard, key, col);
      }
    });

    opps.forEach(o => body.appendChild(buildCard(o)));
    return col;
  }

  function buildCard(opp) {
    const card = document.createElement("div");
    card.className = "card";
    card.draggable = !opp._removed;
    card.dataset.id  = opp.id;
    card.dataset.key = opp._removed ? (opp.stage || "Unknown") : effectiveStage(opp);

    if (opp._isNew)    { card.classList.add("card-new"); }
    if (opp._removed)  { card.classList.add("card-removed"); }

    const w = effectiveWeight(opp);
    const rating = (opp.rating || "").toLowerCase();
    let ratingDot = "";
    if (rating.includes("hot") || rating === "1") ratingDot = `<span class="rating-dot r-hot" title="Hot"></span>`;
    else if (rating.includes("warm") || rating === "2") ratingDot = `<span class="rating-dot r-warm" title="Warm"></span>`;
    else if (rating.includes("cold") || rating === "3") ratingDot = `<span class="rating-dot r-cold" title="Cold"></span>`;

    const showStagePill = groupBy === "status";
    const stagePill = showStagePill
      ? `<span class="stage-chip">${escHtml(effectiveStage(opp))}</span>`
      : "";

    // Status select (only meaningful when not grouping by status, so user can change it)
    const statusSelect = !opp._removed ? `
      <select class="status-select" data-id="${opp.id}" title="Status">
        ${["Open","In Progress","On Hold","Won","Canceled","Out-Sold","Lost"].map(s =>
          `<option${s === (opp.status||"Open") ? " selected" : ""}>${s}</option>`
        ).join("")}
      </select>` : "";

    card.innerHTML = `
      ${opp._isNew ? '<span class="card-badge badge-new">New</span>' : ""}
      ${opp._removed ? '<span class="card-badge badge-removed">Removed</span>' : ""}
      <div class="card-title">${escHtml(opp.name)}</div>
      ${opp.account ? `<div class="card-account">${escHtml(opp.account)}</div>` : ""}
      <div class="card-meta">
        ${ratingDot}
        ${opp.estValue ? `<span class="card-value">${fmt(opp.estValue)}</span>` : ""}
        ${opp.closeDate ? `<span style="font-size:11px;color:var(--muted)">${escHtml(opp.closeDate)}</span>` : ""}
        ${stagePill}
        ${statusSelect}
        <span class="weight-wrap">
          <span class="weight-label">Wt</span>
          <input class="weight-input" type="number" min="0" max="100"
            value="${w}" data-id="${opp.id}" data-orig="${w}"
            title="Deal weight / probability (%)"
            ${opp._removed ? "disabled" : ""} />
          <span class="weight-pct">%</span>
        </span>
      </div>`;

    // Rating border
    if (rating.includes("hot") || rating === "1") card.style.borderLeftColor = "var(--danger)";
    else if (rating.includes("warm") || rating === "2") card.style.borderLeftColor = "var(--warn)";

    if (!opp._removed) {
      card.addEventListener("dragstart", e => {
        dragSourceCard = card;
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", opp.id);
      });
      card.addEventListener("dragend", () => {
        card.classList.remove("dragging");
        dragSourceCard = null;
      });

      // Status select change
      const sel = card.querySelector(".status-select");
      if (sel) {
        sel.addEventListener("mousedown", e => e.stopPropagation());
        sel.addEventListener("change", () => {
          const oIdx = opportunities.findIndex(x => x.id === opp.id);
          if (oIdx > -1) opportunities[oIdx].status = sel.value;
          save(KEY_DATA, opportunities.map(o => ({ ...o, _isNew: false })));
          showToast(`Status → ${sel.value}`);
        });
      }
    }

    // Weight input
    const wi = card.querySelector(".weight-input");
    if (wi) {
      wi.addEventListener("mousedown", e => e.stopPropagation());
      wi.addEventListener("click", e => e.stopPropagation());
      wi.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); wi.blur(); } });
      wi.addEventListener("blur", () => {
        const orig = parseFloat(wi.dataset.orig);
        const nv = Math.min(100, Math.max(0, parseInt(wi.value, 10) || 0));
        wi.value = nv;
        if (nv !== orig) {
          manualWeights[opp.id] = nv;
          wi.dataset.orig = nv;
          save(KEY_WEIGHTS, manualWeights);
          showToast(`Weight → ${nv}%`);
        }
      });
    }

    return card;
  }

  // ── Drag & drop ───────────────────────────────────────────────────────────
  function dropCard(cardEl, newKey, targetCol) {
    const id = cardEl.dataset.id;
    const opp = opportunities.find(o => o.id === id);
    if (!opp) return;

    // Update groupBy key
    if (groupBy === "stage") {
      manualStatuses[id] = newKey;
      save(KEY_STATUSES, manualStatuses);
    } else {
      opp.status = newKey;
      save(KEY_DATA, opportunities.map(o => ({ ...o, _isNew: false })));
    }

    cardEl.dataset.key = newKey;

    // Move in DOM
    const oldBody = cardEl.parentElement;
    const newBody = targetCol.querySelector(".column-body");
    newBody.appendChild(cardEl);

    updateCount(oldBody.closest(".column"));
    updateCount(targetCol);
    showToast(`Moved to ${newKey}`);
  }

  function updateCount(colEl) {
    if (!colEl) return;
    const cards = colEl.querySelectorAll(".card:not(.card-removed)");
    const c = colEl.querySelector(".count");
    if (c) c.textContent = cards.length;
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function refreshLastUploadLabel() {
    const ts = localStorage.getItem(KEY_UPLOAD_TS);
    const el = document.getElementById("last-upload");
    if (!ts) { el.textContent = ""; return; }
    const d = new Date(ts);
    const diff = Math.floor((Date.now() - d) / 86400000);
    const label = diff === 0 ? "today"
      : diff === 1 ? "yesterday"
      : `${diff} days ago`;
    el.textContent = `Last upload: ${label}`;
  }

  function syncGbButtons() {
    document.querySelectorAll(".gb-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.gb === groupBy);
    });
  }

  function fmt(v) {
    if (!v) return "";
    return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(v);
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  let toastTimer;
  function showToast(msg, isError = false, variant = "") {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "show" + (isError ? " error" : variant === "success" ? " success" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ""; }, 3200);
  }

  boot();
})();
</script>
</body>
</html>
