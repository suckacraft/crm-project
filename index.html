<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportunities Kanban</title>
  <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"
          integrity="sha384-NmPJEzNgXjSNABiMKB9xHNJHAdIBJFBNcHyAK5QCa+TviqWdH0yGaFn7p12A5Bl"
          crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f2f5;
      --col-bg: #ebecf0;
      --col-header: #fff;
      --card-bg: #fff;
      --card-shadow: 0 1px 3px rgba(0,0,0,.12);
      --accent: #0052cc;
      --accent-light: #e6f0ff;
      --danger: #de350b;
      --success: #00875a;
      --warn: #ff8b00;
      --text: #172b4d;
      --muted: #6b778c;
      --border: #dfe1e6;
      --radius: 6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      height: 52px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #topbar h1 { font-size: 16px; font-weight: 600; flex: 1; }
    #topbar .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--accent-light);
      color: var(--accent);
    }
    #btn-login, #btn-logout, #btn-refresh {
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      cursor: pointer;
      background: #fff;
      color: var(--text);
      transition: background .15s;
    }
    #btn-login { background: var(--accent); color: #fff; border-color: var(--accent); }
    #btn-login:hover { background: #0043a8; }
    #btn-refresh:hover, #btn-logout:hover { background: var(--bg); }
    #status-msg {
      font-size: 12px;
      color: var(--muted);
      min-width: 160px;
    }
    #search {
      font-size: 13px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 180px;
      outline: none;
    }
    #search:focus { border-color: var(--accent); }

    /* ── Board ── */
    #board {
      display: flex;
      gap: 12px;
      padding: 16px;
      overflow-x: auto;
      flex: 1;
      align-items: flex-start;
    }

    /* ── Column ── */
    .column {
      flex-shrink: 0;
      width: 280px;
      display: flex;
      flex-direction: column;
      background: var(--col-bg);
      border-radius: var(--radius);
      max-height: calc(100vh - 90px);
    }
    .column-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: var(--col-header);
      border-radius: var(--radius) var(--radius) 0 0;
      border-bottom: 2px solid var(--col-bg);
      font-weight: 600;
      font-size: 13px;
    }
    .column-header .count {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      background: var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 1px 7px;
    }
    .column-header .col-value {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
    }
    .column-body {
      padding: 8px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .column-body.drag-over {
      background: #d0e4ff;
      border-radius: 0 0 var(--radius) var(--radius);
    }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 10px 12px;
      box-shadow: var(--card-shadow);
      cursor: grab;
      transition: box-shadow .15s, opacity .15s;
      user-select: none;
      border-left: 3px solid transparent;
    }
    .card:active { cursor: grabbing; }
    .card.dragging { opacity: .4; }
    .card.saving { opacity: .6; pointer-events: none; }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 6px;
      color: var(--text);
    }
    .card-account {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .card-value {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    /* weight pill */
    .weight-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .weight-label { font-size: 10px; color: var(--muted); }
    .weight-input {
      width: 46px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 4px;
      background: #f4f5f7;
      color: var(--text);
      outline: none;
      cursor: text;
    }
    .weight-input:focus { border-color: var(--accent); background: #fff; }
    .weight-pct { font-size: 11px; color: var(--muted); }

    /* rating dot */
    .rating-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .rating-hot  { background: var(--danger); }
    .rating-warm { background: var(--warn); }
    .rating-cold { background: #8993a4; }

    /* status chip — shown when groupBy=stepname to display statuscode */
    .status-chip {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .status-open     { background: #e3fcef; color: #006644; }
    .status-won      { background: #e6f0ff; color: #0052cc; }
    .status-lost     { background: #ffebe6; color: #bf2600; }
    .status-onhold   { background: #fffae6; color: #974f0c; }

    /* ── Save indicator ── */
    .save-spinner {
      display: none;
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 20px; right: 20px;
      background: #253858;
      color: #fff;
      font-size: 13px;
      padding: 10px 16px;
      border-radius: var(--radius);
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .25s, transform .25s;
      pointer-events: none;
      z-index: 999;
      max-width: 320px;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.error { background: var(--danger); }

    /* ── Auth overlay ── */
    #auth-overlay {
      position: fixed; inset: 0;
      background: rgba(240,242,245,.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
    }
    #auth-overlay h2 { font-size: 22px; }
    #auth-overlay p  { font-size: 14px; color: var(--muted); max-width: 380px; text-align: center; }
    #auth-overlay button {
      font-size: 14px;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: var(--radius);
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    #auth-overlay button:hover { background: #0043a8; }

    /* ── Loading skeleton ── */
    .skeleton { background: linear-gradient(90deg,#e0e0e0 25%,#f5f5f5 50%,#e0e0e0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 4px; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ── Empty column ── */
    .empty-col {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 20px 0;
    }
  </style>
</head>
<body>

<!-- Auth overlay (shown until signed in) -->
<div id="auth-overlay">
  <h2>Opportunities Kanban</h2>
  <p>Sign in with your Microsoft account to load opportunities from Dynamics 365.</p>
  <button id="overlay-login">Sign in with Microsoft</button>
</div>

<!-- Top bar -->
<div id="topbar">
  <h1>Opportunities Kanban</h1>
  <input id="search" type="search" placeholder="Search opportunities…" />
  <span id="status-msg">Not signed in</span>
  <button id="btn-refresh" style="display:none">↻ Refresh</button>
  <button id="btn-logout" style="display:none">Sign out</button>
  <button id="btn-login">Sign in</button>
</div>

<!-- Board -->
<div id="board"></div>

<!-- Toast notification -->
<div id="toast"></div>

<script>
(function () {
  "use strict";

  const cfg = window.CRM_CONFIG;
  if (!cfg) { alert("config.js not loaded"); return; }

  // ── MSAL setup ────────────────────────────────────────────────────────────
  const msalConfig = {
    auth: {
      clientId: cfg.clientId,
      authority: `https://login.microsoftonline.com/${cfg.tenantId}`,
      redirectUri: window.location.origin + window.location.pathname,
    },
    cache: { cacheLocation: "sessionStorage" },
  };
  const msalInstance = new msal.PublicClientApplication(msalConfig);
  const scopes = [`${cfg.dynamicsUrl.replace(/\/$/, "")}/.default`];

  let currentAccount = null;
  let allOpportunities = [];  // raw data from Dynamics
  let dragSourceCard = null;

  // ── Helpers ───────────────────────────────────────────────────────────────
  function showToast(msg, isError = false) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "show" + (isError ? " error" : "");
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = ""; }, 3500);
  }

  function setStatus(msg) {
    document.getElementById("status-msg").textContent = msg;
  }

  function fmt(v) {
    if (v == null || v === "") return "";
    return new Intl.NumberFormat("en-US", {
      style: "currency", currency: "USD", maximumFractionDigits: 0,
    }).format(v);
  }

  // ── Auth ──────────────────────────────────────────────────────────────────
  async function getToken() {
    const req = { account: currentAccount, scopes };
    try {
      const r = await msalInstance.acquireTokenSilent(req);
      return r.accessToken;
    } catch {
      const r = await msalInstance.acquireTokenPopup(req);
      return r.accessToken;
    }
  }

  async function signIn() {
    try {
      const r = await msalInstance.loginPopup({ scopes });
      currentAccount = r.account;
      onSignedIn();
    } catch (e) {
      showToast("Sign-in failed: " + e.message, true);
    }
  }

  function signOut() {
    msalInstance.logoutPopup({ account: currentAccount });
    currentAccount = null;
    allOpportunities = [];
    renderBoard([]);
    setStatus("Not signed in");
    document.getElementById("btn-login").style.display = "";
    document.getElementById("btn-logout").style.display = "none";
    document.getElementById("btn-refresh").style.display = "none";
    document.getElementById("auth-overlay").style.display = "flex";
  }

  function onSignedIn() {
    document.getElementById("auth-overlay").style.display = "none";
    document.getElementById("btn-login").style.display = "none";
    document.getElementById("btn-logout").style.display = "";
    document.getElementById("btn-refresh").style.display = "";
    setStatus(currentAccount.username);
    loadOpportunities();
  }

  // ── Dynamics API ──────────────────────────────────────────────────────────
  const BASE = cfg.dynamicsUrl.replace(/\/$/, "") + "/api/data/v9.2";

  async function apiFetch(path, opts = {}) {
    const token = await getToken();
    const headers = {
      Authorization: `Bearer ${token}`,
      "OData-MaxVersion": "4.0",
      "OData-Version": "4.0",
      Accept: "application/json",
      "Content-Type": "application/json; charset=utf-8",
      ...(opts.headers || {}),
    };
    const res = await fetch(BASE + path, { ...opts, headers });
    if (!res.ok) {
      const body = await res.text().catch(() => "");
      throw new Error(`Dynamics ${res.status}: ${body.slice(0, 200)}`);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  async function loadOpportunities() {
    setStatus("Loading…");
    renderBoardSkeleton();
    try {
      const fields = [
        "opportunityid",
        "name",
        "statecode",
        "statuscode",
        "stepname",
        "closeprobability",
        "estimatedvalue",
        "actualvalue",
        "opportunityratingcode",
        "_parentaccountid_value",
        "_parentcontactid_value",
        "createdon",
        "estimatedclosedate",
      ].join(",");

      const filter = encodeURIComponent("statecode eq 0 or statecode eq 1 or statecode eq 2");
      const url = `/opportunities?$select=${fields}&$filter=${filter}&$orderby=createdon desc&$top=${cfg.pageSize}`;

      const data = await apiFetch(url);
      allOpportunities = data.value || [];
      setStatus(`${currentAccount.username} · ${allOpportunities.length} opps`);
      renderBoard(filter_search(allOpportunities));
    } catch (e) {
      setStatus("Error loading");
      showToast(e.message, true);
    }
  }

  async function patchOpportunity(id, body) {
    await apiFetch(`/opportunities(${id})`, {
      method: "PATCH",
      headers: { "If-Match": "*", Prefer: "return=representation" },
      body: JSON.stringify(body),
    });
  }

  // ── Status helpers ────────────────────────────────────────────────────────
  const STATECODE_LABEL = { 0: "Open", 1: "Won", 2: "Lost" };
  const STATUSCODE_LABEL = {
    1: "In Progress", 2: "On Hold", 3: "Won", 4: "Canceled", 5: "Out-Sold",
  };
  const STATUSCODE_CSS = {
    1: "status-open", 2: "status-onhold", 3: "status-won",
    4: "status-lost", 5: "status-lost",
  };
  const RATING_CSS = { 1: "rating-hot", 2: "rating-warm", 3: "rating-cold" };
  const RATING_LABEL = { 1: "Hot", 2: "Warm", 3: "Cold" };

  function groupKey(opp) {
    if (cfg.groupBy === "statuscode") {
      return STATUSCODE_LABEL[opp.statuscode] || `Status ${opp.statuscode}`;
    }
    return opp.stepname || STATECODE_LABEL[opp.statecode] || "Unknown";
  }

  function columnColor(key) {
    const map = {
      Qualify: "#0052cc", Develop: "#6554c0", Propose: "#ff8b00",
      Close: "#00875a", Won: "#00875a", Lost: "#de350b",
      "In Progress": "#0052cc", "On Hold": "#ff8b00",
      Canceled: "#de350b", "Out-Sold": "#de350b",
    };
    return map[key] || "#8993a4";
  }

  function colTotalValue(opps) {
    const sum = opps.reduce((s, o) => s + (o.estimatedvalue || 0), 0);
    return sum > 0 ? fmt(sum) : "";
  }

  // ── Search filter ─────────────────────────────────────────────────────────
  function filter_search(opps) {
    const q = document.getElementById("search").value.trim().toLowerCase();
    if (!q) return opps;
    return opps.filter(o =>
      (o.name || "").toLowerCase().includes(q) ||
      (o._parentaccountid_value || "").toLowerCase().includes(q)
    );
  }

  // ── Board rendering ───────────────────────────────────────────────────────
  function renderBoardSkeleton() {
    const board = document.getElementById("board");
    board.innerHTML = "";
    const cols = cfg.columnOrder.length
      ? cfg.columnOrder
      : ["Qualify", "Develop", "Propose", "Close"];
    cols.forEach(() => {
      const col = document.createElement("div");
      col.className = "column";
      col.innerHTML = `
        <div class="column-header">
          <span class="skeleton" style="width:80px;height:14px;display:inline-block"></span>
        </div>
        <div class="column-body">
          ${[1,2,3].map(() => `
            <div class="card">
              <div class="skeleton" style="height:14px;margin-bottom:8px"></div>
              <div class="skeleton" style="height:10px;width:60%"></div>
            </div>`).join("")}
        </div>`;
      board.appendChild(col);
    });
  }

  function renderBoard(opps) {
    const board = document.getElementById("board");
    board.innerHTML = "";

    // Group opportunities
    const groups = {};
    opps.forEach(o => {
      const k = groupKey(o);
      if (!groups[k]) groups[k] = [];
      groups[k].push(o);
    });

    // Determine column order
    let keys;
    if (cfg.columnOrder && cfg.columnOrder.length) {
      keys = [...cfg.columnOrder];
      // append any extra keys from data not in configured order
      Object.keys(groups).forEach(k => { if (!keys.includes(k)) keys.push(k); });
    } else {
      keys = Object.keys(groups);
    }

    keys.forEach(key => {
      const colOpps = groups[key] || [];
      const col = buildColumn(key, colOpps);
      board.appendChild(col);
    });
  }

  function buildColumn(key, opps) {
    const col = document.createElement("div");
    col.className = "column";
    col.dataset.key = key;

    const totalVal = colTotalValue(opps);
    col.innerHTML = `
      <div class="column-header" style="border-left:3px solid ${columnColor(key)}">
        <span>${key}</span>
        ${totalVal ? `<span class="col-value">${totalVal}</span>` : ""}
        <span class="count">${opps.length}</span>
      </div>
      <div class="column-body" data-key="${key}">
        ${opps.length === 0 ? '<p class="empty-col">No opportunities</p>' : ""}
      </div>`;

    const body = col.querySelector(".column-body");

    // Drag-over events on column body
    body.addEventListener("dragover", e => {
      e.preventDefault();
      body.classList.add("drag-over");
    });
    body.addEventListener("dragleave", e => {
      if (!body.contains(e.relatedTarget)) body.classList.remove("drag-over");
    });
    body.addEventListener("drop", e => {
      e.preventDefault();
      body.classList.remove("drag-over");
      if (dragSourceCard && dragSourceCard.dataset.key !== key) {
        handleDrop(dragSourceCard, key, body);
      }
    });

    opps.forEach(o => body.appendChild(buildCard(o)));
    return col;
  }

  function buildCard(opp) {
    const card = document.createElement("div");
    card.className = "card";
    card.draggable = true;
    card.dataset.id = opp.opportunityid;
    card.dataset.key = groupKey(opp);

    const ratingClass = RATING_CSS[opp.opportunityratingcode] || "";
    const statusLabel = STATUSCODE_LABEL[opp.statuscode] || "";
    const statusCss   = STATUSCODE_CSS[opp.statuscode] || "status-open";
    const showStatus  = cfg.groupBy === "stepname";

    const val = opp.estimatedvalue ? fmt(opp.estimatedvalue) : "";
    const prob = opp.closeprobability != null ? opp.closeprobability : "";
    const closeDate = opp.estimatedclosedate
      ? new Date(opp.estimatedclosedate).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })
      : "";

    card.innerHTML = `
      <div class="card-title">${escHtml(opp.name || "Untitled")}</div>
      ${opp._parentaccountid_value ? `<div class="card-account" title="${escHtml(opp._parentaccountid_value)}">${escHtml(opp._parentaccountid_value)}</div>` : ""}
      <div class="card-meta">
        ${ratingClass ? `<span class="rating-dot ${ratingClass}" title="${RATING_LABEL[opp.opportunityratingcode]}"></span>` : ""}
        ${val ? `<span class="card-value">${val}</span>` : ""}
        ${closeDate ? `<span style="font-size:11px;color:var(--muted)">${closeDate}</span>` : ""}
        ${showStatus && statusLabel ? `<span class="status-chip ${statusCss}">${statusLabel}</span>` : ""}
        <span class="weight-wrap">
          <span class="weight-label">Wt</span>
          <input
            class="weight-input"
            type="number"
            min="0" max="100"
            value="${prob}"
            title="Deal probability / weight (%)"
            data-id="${opp.opportunityid}"
            data-orig="${prob}"
          />
          <span class="weight-pct">%</span>
        </span>
      </div>`;

    // Color strip by rating
    if (opp.opportunityratingcode === 1) card.style.borderLeftColor = "var(--danger)";
    else if (opp.opportunityratingcode === 2) card.style.borderLeftColor = "var(--warn)";

    // Drag events
    card.addEventListener("dragstart", e => {
      dragSourceCard = card;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", opp.opportunityid);
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      dragSourceCard = null;
    });

    // Weight input save-on-blur/enter
    const input = card.querySelector(".weight-input");
    input.addEventListener("click", e => e.stopPropagation());
    input.addEventListener("mousedown", e => e.stopPropagation()); // prevent drag
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
    });
    input.addEventListener("blur", () => {
      const orig = parseFloat(input.dataset.orig);
      const newVal = Math.min(100, Math.max(0, parseInt(input.value, 10) || 0));
      input.value = newVal;
      if (newVal !== orig) saveWeight(opp.opportunityid, newVal, input, card);
    });

    return card;
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── Drag & drop status update ─────────────────────────────────────────────
  async function handleDrop(cardEl, newKey, targetBody) {
    const id = cardEl.dataset.id;
    const opp = allOpportunities.find(o => o.opportunityid === id);
    if (!opp) return;

    // Optimistically move card in DOM
    const oldBody = cardEl.parentElement;
    targetBody.appendChild(cardEl);
    cardEl.dataset.key = newKey;

    // Update column counts
    updateColCount(oldBody.closest(".column"));
    updateColCount(targetBody.closest(".column"));

    // Build PATCH payload
    const patch = buildStatusPatch(opp, newKey);
    if (!patch) {
      showToast("Cannot map '" + newKey + "' to a Dynamics status.", true);
      return;
    }

    cardEl.classList.add("saving");
    try {
      await patchOpportunity(id, patch);
      // Update local cache
      Object.assign(opp, patch);
      showToast(`Moved "${opp.name}" → ${newKey}`);
    } catch (e) {
      showToast("Save failed: " + e.message, true);
      // Revert DOM
      oldBody.appendChild(cardEl);
      cardEl.dataset.key = groupKey(opp);
      updateColCount(oldBody.closest(".column"));
      updateColCount(targetBody.closest(".column"));
    } finally {
      cardEl.classList.remove("saving");
    }
  }

  function buildStatusPatch(opp, newKey) {
    if (cfg.groupBy === "stepname") {
      // Only update stepname; statecode/statuscode stay same (unless it's Won/Lost)
      const patch = { stepname: newKey };
      const upper = newKey.toUpperCase();
      if (upper === "WON")  { patch.statecode = 1; patch.statuscode = 3; }
      if (upper === "LOST" || upper === "CANCELED") { patch.statecode = 2; patch.statuscode = 4; }
      return patch;
    }
    // groupBy statuscode
    const map = {
      "In Progress": { statuscode: 1, statecode: 0 },
      "On Hold":     { statuscode: 2, statecode: 0 },
      "Won":         { statuscode: 3, statecode: 1 },
      "Canceled":    { statuscode: 4, statecode: 2 },
      "Out-Sold":    { statuscode: 5, statecode: 2 },
    };
    return map[newKey] || null;
  }

  function updateColCount(colEl) {
    if (!colEl) return;
    const body = colEl.querySelector(".column-body");
    const cards = body.querySelectorAll(".card");
    const count = colEl.querySelector(".count");
    if (count) count.textContent = cards.length;
  }

  // ── Weight save ───────────────────────────────────────────────────────────
  async function saveWeight(id, newVal, inputEl, cardEl) {
    cardEl.classList.add("saving");
    try {
      await patchOpportunity(id, { closeprobability: newVal });
      const opp = allOpportunities.find(o => o.opportunityid === id);
      if (opp) opp.closeprobability = newVal;
      inputEl.dataset.orig = newVal;
      showToast(`Weight updated → ${newVal}%`);
    } catch (e) {
      showToast("Save failed: " + e.message, true);
      inputEl.value = inputEl.dataset.orig; // revert
    } finally {
      cardEl.classList.remove("saving");
    }
  }

  // ── Event wiring ──────────────────────────────────────────────────────────
  document.getElementById("btn-login").addEventListener("click", signIn);
  document.getElementById("overlay-login").addEventListener("click", signIn);
  document.getElementById("btn-logout").addEventListener("click", signOut);
  document.getElementById("btn-refresh").addEventListener("click", loadOpportunities);

  let searchTimer;
  document.getElementById("search").addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => renderBoard(filter_search(allOpportunities)), 200);
  });

  // ── Boot: check for existing MSAL session ─────────────────────────────────
  (async () => {
    await msalInstance.initialize();

    // Handle redirect (if using redirect flow)
    try { await msalInstance.handleRedirectPromise(); } catch {}

    const accounts = msalInstance.getAllAccounts();
    if (accounts.length > 0) {
      currentAccount = accounts[0];
      onSignedIn();
    }
  })();
})();
</script>
</body>
</html>
